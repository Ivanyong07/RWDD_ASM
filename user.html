<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Collector</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<header class="top">
  <div class="top-left">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#12a875"/><path d="M16 7l2.6 5.6 6.1.7-4.5 4.2 1.2 6L16 20.5 10.6 23.5l1.2-6-4.5-4.2 6.1-.7z" fill="#fff"/></svg>
      <b>Fun</b><span class="sep"></span><span class="brand-sub">Collector</span>
    </div>
    <button class="icon-btn" id="toggleRail" aria-label="Show or hide menu">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
  </div>
  <div class="top-right">
    <button class="icon-btn" id="homeBtn" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
    <button class="icon-btn" id="bellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg></button>
    <div class="user-wrap">
      <button class="user" id="userBtn" aria-haspopup="true" aria-expanded="false">
        <img src="avatar.svg" alt="Profile picture" width="36" height="36">
        <span id="userName">Aiman Rahman</span>
        <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="menu" id="userMenu" hidden>
        <div class="menu-info"><b id="menuRank"></b><span class="small" id="menuPts"></span></div>
        <button id="reset">Reset demo data</button>
      </div>
    </div>
  </div>
</header>

<div class="shell" id="shell">

  <!-- LEFT NAV -->
  <nav class="rail" role="tablist" aria-label="Dashboard" aria-orientation="vertical">
    <button role="tab" data-tab="rank" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg></span>Rank</button>
    <button role="tab" data-tab="history" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>History</button>
    <button role="tab" data-tab="badges" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg></span>Badges</button>
    <button role="tab" data-tab="rewards" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M12 8C10 4 6 5 7 8c.5 1.5 3 1 5 0zm0 0c2-4 6-3 5 0-.5 1.5-3 1-5 0z"/></svg></span>Rewards</button>
  </nav>

  <!-- MAIN PANEL -->
  <main class="main">

    <!-- Banner carousel -->
    <div class="carousel" aria-roledescription="carousel">
      <div class="track" id="track"></div>
      <button class="arrow prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="arrow next" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <div class="dots" id="dots"></div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="tool-left">
        <span class="pill" id="ptsPill">0 pts</span>
        <span class="tool-text" id="toolText"></span>
        <a href="#" class="link" data-go="history">View history ↗</a>
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="search" type="search" placeholder="Search this page" aria-label="Search this page">
        </label>
      </div>
      <div class="promo">
        <small>Next rank</small>
        <b id="promoTitle"></b>
        <div class="mini-bar"><i id="promoFill"></i></div>
      </div>
    </div>

    <div class="sec-head"><h2 id="pageTitle">Rank</h2></div>

    <section id="rank">
      <div class="rank-card">
        <div class="rank-now"><strong id="rankName"></strong><span id="lifeTxt"></span></div>
        <div class="bar" role="progressbar" aria-label="Progress to next rank" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
        <div class="small" id="nextTxt"></div>
        <div class="ladder" id="ladder"></div>
        <div class="stats">
          <div><b id="stLife">0</b><span>Total earned</span></div>
          <div><b id="stDone">0</b><span>Challenges done</span></div>
          <div><b id="stBadge">0</b><span>Badges</span></div>
        </div>
      </div>
      <h3 class="sub-title">Complete challenges to upgrade your rank</h3>
      <div class="tiles" id="challenges"></div>
    </section>

    <section id="history" hidden>
      <div class="hist-top">
        <div class="filters">
          <button class="chip" data-f="all" aria-pressed="true">All</button>
          <button class="chip" data-f="earn" aria-pressed="false">Earned</button>
          <button class="chip" data-f="spend" aria-pressed="false">Spent</button>
        </div>
        <div class="small"><span class="pts plus" id="hEarn"></span> earned · <span class="pts minus" id="hSpend"></span> spent</div>
      </div>
      <div class="hist" id="histList"></div>
    </section>

    <section id="badges" hidden>
      <p class="small" id="badgeCount"></p>
      <div class="tiles" id="badgeGrid"></div>
    </section>

    <section id="rewards" hidden>
      <p class="small">Redeeming spends points but keeps your rank progress.</p>
      <div class="tiles" id="rewardGrid"></div>
    </section>

  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
