<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fun Collectors</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f5f5f5;
        overflow-x: clip;
      }

      /* tall section = the scroll distance */
      #knockout-hero {
        position: relative;
        height: 300vh;
      }

      /* sticky stage stays on screen while you scroll through the section */
      #knockout-stage {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: hidden; /* clips the scaled title. NOT on #knockout-hero, or sticky breaks */
      }

      /* layer 1: the photo (falls back to a gradient if the image is missing) */
      #knockout-photo {
        position: absolute;
        inset: 0;
        background:
          url("project/frontend/images/home.png") center / cover no-repeat,
          linear-gradient(135deg, #f7b267, #f4845f, #3a86a8);
      }

      /* layer 2: the green cover with the title cut out of it */
      #knockout-cover {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0; /* JS fades this in */
      }

      .knockout-title {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 100px; /* JS resizes it to fit the screen width */
        transform-box: fill-box;
        transform-origin: 50% 50%; /* scale from the title's own center */
      }

      /* content after the hero, just so you can see it ends properly */
      #after {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <section id="knockout-hero">
      <div id="knockout-stage">
        <div id="knockout-photo"></div>

        <svg id="knockout-cover" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- mask 1: white = page color stays, black title = cut away (photo shows through) -->
            <mask
              id="title-hole"
              maskUnits="userSpaceOnUse"
              x="0"
              y="0"
              width="100%"
              height="100%"
            >
              <rect width="100%" height="100%" fill="#fff" />
              <text
                class="knockout-title"
                x="50%"
                y="50%"
                text-anchor="middle"
                dominant-baseline="central"
                fill="#000"
              >
                Fun Collectors
              </text>
            </mask>
            <!-- mask 2: the opposite, so the green exists only inside the letters -->
            <mask
              id="title-only"
              maskUnits="userSpaceOnUse"
              x="0"
              y="0"
              width="100%"
              height="100%"
            >
              <rect width="100%" height="100%" fill="#000" />
              <text
                class="knockout-title"
                x="50%"
                y="50%"
                text-anchor="middle"
                dominant-baseline="central"
                fill="#fff"
              >
                Fun Collectors
              </text>
            </mask>
          </defs>
          <!-- plain page-color background with the title cut out -->
          <rect
            width="100%"
            height="100%"
            fill="#f5f5f5"
            mask="url(#title-hole)"
          />
          <!-- green tint inside the title, on top of the photo -->
          <rect
            width="100%"
            height="100%"
            fill="#0c9260"
            fill-opacity="0.55"
            mask="url(#title-only)"
          />
        </svg>
      </div>
    </section>

    <section id="after"><h2>Next section</h2></section>

    <script>
      history.scrollRestoration = "manual";

      const hero = document.getElementById("knockout-hero");
      const cover = document.getElementById("knockout-cover");
      const titles = document.querySelectorAll(".knockout-title");

      // ---- tweak these ----
      const START = 0.15; // progress where the effect begins (0 to 1)
      const FADE_END = 0.65; // progress where the cover is fully green
      const END = 0.9; // progress where the scale stops
      const SCALE_FROM = 0.35; // title size at the start
      const SCALE_TO = 1; // title size at the end (1 = fills TITLE_WIDTH)
      const TITLE_WIDTH = 0.92; // title width as a fraction of the screen at SCALE_TO
      // ---------------------

      const clamp = (v, min = 0, max = 1) => Math.min(Math.max(v, min), max);
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);

      // size the font so "Fun Collectors" is exactly TITLE_WIDTH of the screen wide
      function fitTitle() {
        titles.forEach((t) => (t.style.fontSize = "100px"));
        const w = titles[0].getComputedTextLength();
        const size = (100 * window.innerWidth * TITLE_WIDTH) / w + "px";
        titles.forEach((t) => (t.style.fontSize = size));
      }

      function update() {
        const total = hero.offsetHeight - window.innerHeight;
        const progress = clamp(-hero.getBoundingClientRect().top / total);

        // background + green tint fade from 0 to 1 between START and FADE_END
        cover.style.opacity = clamp((progress - START) / (FADE_END - START));

        // title scales from SCALE_FROM to SCALE_TO between START and END
        const t = easeOut(clamp((progress - START) / (END - START)));
        const scale = SCALE_FROM + (SCALE_TO - SCALE_FROM) * t;
        titles.forEach((el) => (el.style.transform = `scale(${scale})`));
      }

      let ticking = false;
      window.addEventListener("scroll", () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          update();
          ticking = false;
        });
      });
      window.addEventListener("resize", () => {
        fitTitle();
        update();
      });

      fitTitle();
      update();
    </script>
  </body>
</html>
