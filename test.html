<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    .orbit {
      position: absolute;
      inset: 0;
      font-size: 4rem; /* sets the 1em used below */
      transform-origin: 50% calc(100% - 0.5em); /* pivot = bottom center, level with the letter's middle */
      animation: swing 3s ease-in-out forwards;
    }

    .letter {
      position: absolute;
      right: 0;
      bottom: 0;
      margin: 0;
      line-height: 1; /* so the letter is exactly 1em tall */
      animation: upright 3s ease-in-out forwards;
    }

    @keyframes swing {
      to {
        transform: rotate(-180deg);
      }
    } /* counter-clockwise, arcs upward */
    @keyframes upright {
      to {
        transform: rotate(-180deg);
      }
    } /* exact opposite, text stays level */
  </style>
  <body>
    <div class="orbit">
      <p class="letter">Collectors</p>
    </div>
  </body>
</html>
