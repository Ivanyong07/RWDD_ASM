<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafaf8;
        font-family: system-ui, sans-serif;
      }

      .reveal {
        position: relative;
        width: min(90vw, 520px);
        aspect-ratio: 3 / 4;
        overflow: hidden;
        cursor: none;
        touch-action: none;
      }

      .layer {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
      }

      .layer--base {
        background-image:
          url("/project/frontend/images/bryan.jpeg"),
          linear-gradient(135deg, #3a3a3a, #8a8a8a);
      }

      .layer--top {
        background-image:
          url("/project/frontend/images/lee.jpeg"),
          linear-gradient(135deg, #ffd400, #ff7a00);
      }
    </style>
  </head>
  <body>
    <script></script>
  </body>
</html>
