<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Admin</title>
  </head>
  <body class="splash-on">
    <div id="splash" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="logo">
          <img id="logoPic" alt="Fun Collectors logo" onerror="this.remove()" />
        </span>
        Fun Collectors
      </a>

      <div class="top-right">
        <span class="points-pill" title="Points to spend">
          <span id="ptsText">0</span>
        </span>

        <button
          class="icon-btn"
          id="bellBtn"
          aria-label="Notifications"
        ></button>

        <div class="user-wrap">
          <button
            class="user"
            id="userBtn"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <!-- profile picture: filled by js/common.js (the first letter shows if there is no picture) -->
            <span class="avatar"
              ><span id="userInitial"></span
              ><img id="userPic" alt="Profile picture" onerror="this.remove()"
            /></span>
            <span class="user-name" id="userName">Loading...</span>
          </button>
          <div class="menu" id="userMenu" hidden>
            <div class="menu-info">
              <b id="menuRank"></b><span class="muted" id="menuPts"></span>
            </div>
            <button id="demoApprove" hidden>
              Demo: approve my pending photos
            </button>
            <!-- BACKEND: the logout should also end the session -->
            <a href="../auth/index.html">Log out</a>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
